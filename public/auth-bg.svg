<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f3d2e"/>
      <stop offset="0.55" stop-color="#14532d"/>
      <stop offset="1" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <!-- ledger lines -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="120" x2="800" y2="120"/><line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="360" x2="800" y2="360"/><line x1="0" y1="480" x2="800" y2="480"/>
    <line x1="0" y1="600" x2="800" y2="600"/><line x1="0" y1="720" x2="800" y2="720"/>
    <line x1="0" y1="840" x2="800" y2="840"/>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="140" y1="0" x2="140" y2="1000"/><line x1="420" y1="0" x2="420" y2="1000"/>
    <line x1="660" y1="0" x2="660" y2="1000"/>
  </g>
  <!-- coins -->
  <g>
    <circle cx="620" cy="240" r="90" fill="url(#coin)" fill-opacity="0.9"/>
    <circle cx="620" cy="240" r="74" fill="none" stroke="#8b6914" stroke-width="3"/>
    <text x="620" y="262" font-family="Georgia, serif" font-size="64" fill="#7a5a10" text-anchor="middle">$</text>
  </g>
  <g>
    <circle cx="180" cy="700" r="64" fill="url(#coin)" fill-opacity="0.75"/>
    <circle cx="180" cy="700" r="52" fill="none" stroke="#8b6914" stroke-width="2.5"/>
    <text x="180" y="716" font-family="Georgia, serif" font-size="42" fill="#7a5a10" text-anchor="middle">$</text>
  </g>
  <g>
    <circle cx="680" cy="820" r="44" fill="url(#coin)" fill-opacity="0.6"/>
    <circle cx="680" cy="820" r="36" fill="none" stroke="#8b6914" stroke-width="2"/>
    <text x="680" y="832" font-family="Georgia, serif" font-size="28" fill="#7a5a10" text-anchor="middle">$</text>
  </g>
  <!-- subtle bar chart -->
  <g fill="#ffffff" fill-opacity="0.08">
    <rect x="120" y="880" width="50" height="120"/>
    <rect x="200" y="820" width="50" height="180"/>
    <rect x="280" y="760" width="50" height="240"/>
    <rect x="360" y="700" width="50" height="300"/>
  </g>
</svg>
